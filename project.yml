name: WaiGoals
options:
  bundleIdPrefix: is.waiwai
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: "R4A779QVVY"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  WaiGoals:
    type: application
    platform: iOS
    sources:
      - path: WaiGoals
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: is.waiwai.goals
        PRODUCT_NAME: WaiGoals
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WaiGoals
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"

  WaiGoalsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WaiGoalsTests
    dependencies:
      - target: WaiGoals
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: is.waiwai.goals.tests

schemes:
  WaiGoals:
    build:
      targets:
        WaiGoals: all
        WaiGoalsTests: [test]
    test:
      targets:
        - WaiGoalsTests
    run:
      config: Debug
